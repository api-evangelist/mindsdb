aid: mindsdb
name: MindsDB
description: >-
  MindsDB is an open-source (MIT) AI data platform and semantic query engine that
  lets AI agents securely query, transform, and act on data from any datasource
  using SQL. It connects to 200+ databases, applications, and vector stores, builds
  knowledge bases for hybrid vector + keyword search, trains and serves models, and
  runs open-source AI agents and automated jobs — all through a SQL-over-HTTP REST
  API, the MySQL wire protocol, official Python and JavaScript SDKs, and a first-party
  Model Context Protocol (MCP) server. The company now operates as MindsHub
  (mindshub.ai), a unified AI workspace where knowledge workers delegate multi-step
  projects to agents, all built on the MindsDB engine. Originally surfaced as a
  Benchmark portfolio company; enriched by the API Evangelist pipeline.
